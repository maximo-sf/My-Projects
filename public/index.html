<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom LAN Chat</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Rich Media Picker Styles */
        .picker-container {
            position: absolute;
            bottom: 70px;
            right: 20px;
            width: 320px;
            height: 350px;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 12px;
            display: none;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .picker-tabs {
            display: flex;
            background: #0f172a;
            border-bottom: 1px solid #334155;
        }
        .picker-tab {
            flex: 1;
            padding: 8px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .picker-tab.active {
            color: #38bdf8;
            border-bottom: 2px solid #38bdf8;
        }
        .picker-content {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            display: grid;
            gap: 8px;
        }
        .emoji-grid {
            grid-template-columns: repeat(6, 1fr);
            font-size: 1.5rem;
            cursor: pointer;
            text-align: center;
        }
        .gif-grid {
            grid-template-columns: repeat(2, 1fr);
        }
        .gif-grid img, .sticker-grid img {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
        }
        .media-msg img {
            max-width: 200px;
            border-radius: 8px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <header id="chat-header">
            <h2>Classroom LAN Chat</h2>
            <span id="network-badge">Local Network</span>
        </header>

        <main id="chat-messages"></main>

        <!-- Media Picker Box -->
        <div id="media-picker" class="picker-container">
            <div class="picker-tabs">
                <button class="picker-tab active" onclick="switchTab('emojis')">Emojis</button>
                <button class="picker-tab" onclick="switchTab('gifs')">GIFs</button>
                <button class="picker-tab" onclick="switchTab('stickers')">Stickers</button>
            </div>
            <div id="picker-body" class="picker-content emoji-grid"></div>
        </div>

        <footer id="chat-footer">
            <form id="message-form">
                <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" required>
                <input type="file" id="file-input" style="display: none;">
                <button type="button" id="picker-btn" title="Emojis, GIFs & Stickers">😀</button>
                <button type="button" id="attach-btn" title="Attach file">📎</button>
                <button type="submit" id="send-btn">Send</button>
            </form>
        </footer>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        // Fix for popup reappearing: Save username in sessionStorage
        let username = sessionStorage.getItem('chat_username');
        if (!username) {
            username = prompt('Enter your username:') || 'Student';
            sessionStorage.setItem('chat_username', username);
        }

        socket.emit('user-join', username);

        const messagesContainer = document.getElementById('chat-messages');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const attachBtn = document.getElementById('attach-btn');
        const fileInput = document.getElementById('file-input');
        const pickerBtn = document.getElementById('picker-btn');
        const mediaPicker = document.getElementById('media-picker');
        const pickerBody = document.getElementById('picker-body');

        // Sample Media Data
        const emojis = ['😀', '😂', '😍', '😎', '👍', '🔥', '🎉', '🚀', '💯', '❤️', '🙌', '💩'];
        const gifs = [
            'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHIxZ2s5ZzN0czJ3aWZocmdyZ3V4Nm9icXpzaTRscW16eWtlcnd4dyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/lhLIQcznZP77ZTLJnP/giphy.gif',
            'https://media.giphy.com/media/3o7TKSjRrfIPjeiVyM/giphy.gif',
            'https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif'
        ];
        const stickers = [
            'https://cdn-icons-png.flaticon.com/512/4712/4712109.png',
            'https://cdn-icons-png.flaticon.com/512/4712/4712035.png',
            'https://cdn-icons-png.flaticon.com/512/4712/4712038.png'
        ];

        // Toggle Picker
        pickerBtn.addEventListener('click', () => {
            mediaPicker.style.display = mediaPicker.style.display === 'flex' ? 'none' : 'flex';
            switchTab('emojis');
        });

        function switchTab(tab) {
            document.querySelectorAll('.picker-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            pickerBody.className = 'picker-content ' + (tab === 'emojis' ? 'emoji-grid' : 'gif-grid');
            pickerBody.innerHTML = '';

            if (tab === 'emojis') {
                emojis.forEach(e => {
                    const span = document.createElement('span');
                    span.innerText = e;
                    span.onclick = () => { messageInput.value += e; mediaPicker.style.display = 'none'; };
                    pickerBody.appendChild(span);
                });
            } else if (tab === 'gifs' || tab === 'stickers') {
                const list = tab === 'gifs' ? gifs : stickers;
                list.forEach(url => {
                    const img = document.createElement('img');
                    img.src = url;
                    img.onclick = () => {
                        socket.emit('send-media', { type: tab, url });
                        mediaPicker.style.display = 'none';
                    };
                    pickerBody.appendChild(img);
                });
            }
        }

        // Form Submit
        messageForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (text) {
                socket.emit('send-message', { text });
                messageInput.value = '';
            }
        });

        attachBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', async () => {
            const file = fileInput.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/upload', { method: 'POST', body: formData });
                if (!response.ok) throw new Error('Upload failed');
                const data = await response.json();
                socket.emit('share-file', data);
            } catch (err) {
                alert('Error uploading file.');
            } finally {
                fileInput.value = '';
            }
        });

        // Socket Events
        socket.on('receive-message', (data) => {
            appendMessage(`
                <div class="msg-header">
                    <span class="user">${escapeHtml(data.user)}</span>
                    <span class="time">${data.timestamp}</span>
                </div>
                <div class="msg-body">${escapeHtml(data.text)}</div>
            `);
        });

        socket.on('receive-media', (data) => {
            appendMessage(`
                <div class="msg-header">
                    <span class="user">${escapeHtml(data.user)}</span>
                    <span class="time">${data.timestamp}</span>
                </div>
                <div class="msg-body media-msg">
                    <img src="${data.url}" alt="${data.type}">
                </div>
            `);
        });

        socket.on('receive-file', (data) => {
            appendMessage(`
                <div class="msg-header">
                    <span class="user">${escapeHtml(data.user)}</span>
                    <span class="time">${data.timestamp}</span>
                </div>
                <div class="msg-body">
                    Shared a file: <a href="${data.fileUrl}" target="_blank" download>${escapeHtml(data.fileName)}</a>
                </div>
            `);
        });

        socket.on('system-notification', (text) => {
            appendMessage(`<span class="system-text">${escapeHtml(text)}</span>`, 'system-message');
        });

        function appendMessage(content, extraClass = '') {
            const msgCard = document.createElement('div');
            msgCard.className = `message-card ${extraClass}`;
            msgCard.innerHTML = content;
            messagesContainer.appendChild(msgCard);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
