<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom LAN Chat</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Custom scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        .glass-panel {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans h-screen flex flex-col overflow-hidden transition-colors duration-200 dark:bg-slate-950 dark:text-slate-100">

    <!-- Top Navigation Header -->
    <header class="h-16 bg-slate-900/80 border-b border-slate-800 flex items-center justify-between px-4 z-20 glass-panel">
        <div class="flex items-center space-x-3">
            <button id="toggle-sidebar-btn" class="md:hidden text-slate-400 hover:text-white p-2 rounded-lg">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-500 flex items-center justify-center text-white font-bold shadow-lg shadow-sky-500/20">
                    <i class="fa-solid fa-comments text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base leading-tight">Classroom LAN Chat</h1>
                    <div class="flex items-center space-x-1.5 text-xs text-emerald-400">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span id="connection-status">Connected to LAN</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Search Bar & Controls -->
        <div class="flex items-center space-x-3">
            <div class="relative hidden sm:block w-48 lg:w-64">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                <input type="text" id="search-input" placeholder="Search messages..." class="w-full bg-slate-800 border border-slate-700 text-xs text-slate-200 rounded-lg pl-8 pr-3 py-1.5 focus:outline-none focus:border-sky-500 transition-colors">
            </div>

            <!-- Audio Mute Toggle -->
            <button id="sound-toggle-btn" class="p-2 text-slate-400 hover:text-sky-400 hover:bg-slate-800 rounded-lg transition-colors" title="Toggle Sound">
                <i class="fa-solid fa-volume-high text-base"></i>
            </button>

            <!-- Theme Toggle -->
            <button id="theme-toggle-btn" class="p-2 text-slate-400 hover:text-amber-400 hover:bg-slate-800 rounded-lg transition-colors" title="Toggle Theme">
                <i class="fa-solid fa-moon text-base"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Layout -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- Sidebar / User & Room List -->
        <aside id="sidebar" class="absolute md:relative z-10 w-64 h-full bg-slate-900 border-r border-slate-800 flex flex-col transition-transform duration-300 -translate-x-full md:translate-x-0">
            <!-- User Profile Header -->
            <div class="p-4 border-b border-slate-800 flex items-center space-x-3 bg-slate-800/40">
                <div class="w-10 h-10 rounded-full bg-sky-600 flex items-center justify-center font-bold text-white text-sm" id="user-avatar">
                    U
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-semibold truncate" id="current-username">Username</p>
                    <p class="text-xs text-slate-400 flex items-center gap-1">
                        <i class="fa-solid fa-network-wired text-xs text-sky-400"></i> Local Peer
                    </p>
                </div>
            </div>

            <!-- Online Users List -->
            <div class="flex-1 overflow-y-auto p-3">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider px-2 mb-2 flex justify-between items-center">
                    <span>Active Peers</span>
                    <span id="user-count" class="bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full text-xs">1</span>
                </h3>
                <ul id="users-list" class="space-y-1">
                    <!-- User items generated dynamically -->
                </ul>
            </div>

            <div class="p-3 border-t border-slate-800 text-center text-xs text-slate-500">
                Classroom LAN Chat v2.0
            </div>
        </aside>

        <!-- Overlay for Mobile Sidebar -->
        <div id="sidebar-overlay" class="hidden fixed inset-0 bg-black/50 z-0 md:hidden"></div>

        <!-- Chat Container -->
        <main id="drop-zone" class="flex-1 flex flex-col bg-slate-950 relative overflow-hidden">
            
            <!-- Drag & Drop Overlay Indicator -->
            <div id="drag-overlay" class="hidden absolute inset-0 bg-sky-900/80 border-4 border-dashed border-sky-400 z-30 flex flex-col items-center justify-center glass-panel">
                <i class="fa-solid fa-cloud-arrow-up text-6xl text-sky-300 animate-bounce mb-3"></i>
                <p class="text-xl font-bold text-white">Drop file to share with class</p>
                <p class="text-sm text-sky-200">Max size 50MB</p>
            </div>

            <!-- Messages Area -->
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-4">
                <!-- Welcome Card -->
                <div class="max-w-md mx-auto my-6 bg-slate-900/60 border border-slate-800 rounded-xl p-4 text-center">
                    <i class="fa-solid fa-shield-halved text-2xl text-sky-400 mb-2"></i>
                    <h3 class="text-sm font-semibold text-slate-200">Local Classroom Workspace</h3>
                    <p class="text-xs text-slate-400 mt-1">All messages and files remain inside your local subnet. No internet access required.</p>
                </div>
            </div>

            <!-- Upload Progress Bar -->
            <div id="upload-progress-container" class="hidden px-4 py-2 bg-slate-900 border-t border-slate-800">
                <div class="flex items-center justify-between text-xs mb-1">
                    <span id="upload-file-name" class="font-medium text-slate-300 truncate max-w-xs">Uploading file...</span>
                    <span id="upload-percentage" class="text-sky-400">0%</span>
                </div>
                <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
                    <div id="upload-progress-bar" class="bg-sky-500 h-1.5 rounded-full transition-all duration-150" style="width: 0%"></div>
                </div>
            </div>

            <!-- Input Controls Area -->
            <footer class="p-3 bg-slate-900 border-t border-slate-800">
                <form id="message-form" class="flex items-end gap-2">
                    <div class="flex-1 bg-slate-800 border border-slate-700 rounded-xl flex items-center px-3 focus-within:border-sky-500 transition-colors">
                        <textarea id="message-input" rows="1" placeholder="Type a message or paste code..." class="w-full bg-transparent py-2.5 text-sm text-slate-100 focus:outline-none resize-none max-h-32"></textarea>
                        
                        <input type="file" id="file-input" class="hidden">
                        <button type="button" id="attach-btn" class="text-slate-400 hover:text-sky-400 p-2 transition-colors" title="Share File">
                            <i class="fa-solid fa-paperclip text-lg"></i>
                        </button>
                    </div>

                    <button type="submit" id="send-btn" class="bg-sky-600 hover:bg-sky-500 text-white w-10 h-10 rounded-xl flex items-center justify-center transition-all shadow-md shadow-sky-600/20 flex-shrink-0">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </footer>
        </main>
    </div>

    <!-- Socket.io Script -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // --- Web Audio API Notifications ---
        class SoundEffects {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playTone(freq, type, duration, gainValue = 0.1) {
                if (this.muted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(gainValue, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }

            playReceive() {
                this.playTone(600, 'sine', 0.15, 0.08);
                setTimeout(() => this.playTone(800, 'sine', 0.2, 0.08), 80);
            }

            playSend() {
                this.playTone(400, 'sine', 0.1, 0.05);
            }

            playJoin() {
                this.playTone(523.25, 'triangle', 0.15, 0.05); // C5
                setTimeout(() => this.playTone(659.25, 'triangle', 0.2, 0.05), 100); // E5
            }
        }

        const sounds = new SoundEffects();
        const socket = io();

        // --- App State ---
        let username = prompt('Enter your display name:') || 'Peer-' + Math.floor(Math.random() * 1000);
        document.getElementById('current-username').textContent = username;
        document.getElementById('user-avatar').textContent = username.charAt(0).toUpperCase();

        socket.emit('user-join', username);

        // --- DOM Elements ---
        const messagesContainer = document.getElementById('chat-messages');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const attachBtn = document.getElementById('attach-btn');
        const fileInput = document.getElementById('file-input');
        const searchInput = document.getElementById('search-input');
        const dropZone = document.getElementById('drop-zone');
        const dragOverlay = document.getElementById('drag-overlay');
        const usersList = document.getElementById('users-list');
        const userCount = document.getElementById('user-count');
        const soundToggleBtn = document.getElementById('sound-toggle-btn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const toggleSidebarBtn = document.getElementById('toggle-sidebar-btn');

        // --- Auto Expand Textarea ---
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                messageForm.dispatchEvent(new Event('submit'));
            }
        });

        // --- Messaging ---
        messageForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (text) {
                socket.emit('send-message', { text });
                messageInput.value = '';
                messageInput.style.height = 'auto';
                sounds.playSend();
            }
        });

        // --- Sound & Sidebar Toggles ---
        soundToggleBtn.addEventListener('click', () => {
            sounds.muted = !sounds.muted;
            soundToggleBtn.innerHTML = sounds.muted 
                ? '<i class="fa-solid fa-volume-xmark text-slate-500"></i>' 
                : '<i class="fa-solid fa-volume-high text-base"></i>';
        });

        toggleSidebarBtn.addEventListener('click', () => {
            sidebar.classList.toggle('-translate-x-full');
            sidebarOverlay.classList.toggle('hidden');
        });

        sidebarOverlay.addEventListener('click', () => {
            sidebar.classList.add('-translate-x-full');
            sidebarOverlay.classList.add('hidden');
        });

        // --- Drag & Drop Upload Handlers ---
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dragOverlay.classList.remove('hidden');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dragOverlay.classList.add('hidden');
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            if (files.length) handleFileUpload(files[0]);
        });

        attachBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) handleFileUpload(fileInput.files[0]);
        });

        // --- XHR File Upload with Progress ---
        function handleFileUpload(file) {
            const formData = new FormData();
            formData.append('file', file);

            const progressContainer = document.getElementById('upload-progress-container');
            const progressBar = document.getElementById('upload-progress-bar');
            const progressPercent = document.getElementById('upload-percentage');
            const fileNameDisplay = document.getElementById('upload-file-name');

            fileNameDisplay.textContent = `Uploading ${file.name}...`;
            progressContainer.classList.remove('hidden');

            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/upload', true);

            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    progressBar.style.width = percent + '%';
                    progressPercent.textContent = percent + '%';
                }
            };

            xhr.onload = function() {
                progressContainer.classList.add('hidden');
                progressBar.style.width = '0%';
                fileInput.value = '';

                if (xhr.status === 200) {
                    const data = JSON.parse(xhr.responseText);
                    socket.emit('share-file', data);
                    sounds.playSend();
                } else {
                    alert('Upload failed.');
                }
            };

            xhr.onerror = function() {
                progressContainer.classList.add('hidden');
                alert('An error occurred during file upload.');
            };

            xhr.send(formData);
        }

        // --- Search Filter ---
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const cards = messagesContainer.querySelectorAll('.msg-card');
            cards.forEach(card => {
                const text = card.textContent.toLowerCase();
                card.style.display = text.includes(query) ? 'flex' : 'none';
            });
        });

        // --- Socket Events ---
        socket.on('receive-message', (data) => {
            const isMe = data.user === username;
            appendMessage(data, isMe, 'text');
            if (!isMe) sounds.playReceive();
        });

        socket.on('receive-file', (data) => {
            const isMe = data.user === username;
            appendMessage(data, isMe, 'file');
            if (!isMe) sounds.playReceive();
        });

        socket.on('system-notification', (text) => {
            appendSystemNotification(text);
            sounds.playJoin();
        });

        // --- Render UI Functions ---
        function appendMessage(data, isMe, type) {
            const wrapper = document.createElement('div');
            wrapper.className = `msg-card flex gap-3 ${isMe ? 'flex-row-reverse' : 'flex-row'} items-start group`;

            const avatarBg = isMe ? 'bg-sky-600' : 'bg-slate-700';
            const bubbleBg = isMe ? 'bg-sky-600 text-white' : 'bg-slate-800 text-slate-100 border border-slate-700/60';

            let bodyContent = '';
            if (type === 'file') {
                bodyContent = `
                    <div class="flex items-center space-x-3 bg-slate-900/50 p-2.5 rounded-lg border border-slate-700/50">
                        <i class="fa-solid fa-file-arrow-down text-2xl text-sky-400"></i>
                        <div class="flex-1 min-w-0">
                            <p class="text-xs font-semibold truncate">${escapeHtml(data.fileName)}</p>
                            <a href="${data.fileUrl}" target="_blank" download class="text-xs text-sky-400 hover:underline">Download File</a>
                        </div>
                    </div>`;
            } else {
                bodyContent = `<p class="text-sm leading-relaxed whitespace-pre-wrap">${escapeHtml(data.text)}</p>`;
            }

            wrapper.innerHTML = `
                <div class="w-8 h-8 rounded-full ${avatarBg} flex items-center justify-center font-bold text-xs text-white flex-shrink-0">
                    ${escapeHtml(data.user.charAt(0).toUpperCase())}
                </div>
                <div class="max-w-[75%] space-y-1">
                    <div class="flex items-center space-x-2 ${isMe ? 'justify-end' : ''}">
                        <span class="text-xs font-medium text-slate-400">${escapeHtml(data.user)}</span>
                        <span class="text-[10px] text-slate-500">${data.timestamp}</span>
                    </div>
                    <div class="p-3 rounded-2xl ${bubbleBg} shadow-sm">
                        ${bodyContent}
                    </div>
                </div>
            `;

            messagesContainer.appendChild(wrapper);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function appendSystemNotification(text) {
            const div = document.createElement('div');
            div.className = 'text-center my-2';
            div.innerHTML = `<span class="inline-block bg-slate-800/80 text-slate-400 text-xs px-3 py-1 rounded-full border border-slate-700/50">${escapeHtml(text)}</span>`;
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
