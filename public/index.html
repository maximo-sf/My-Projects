<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom LAN Chat Ultimate</title>
    <style>
        /* Variables Modo Oscuro (Por defecto) */
        :root {
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --bg-sidebar: #0b1120;
            --bg-element: #334155;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-purple: #a855f7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        /* Variables Modo Claro */
        body.light-theme {
            --bg-dark: #e2e8f0;
            --bg-panel: #ffffff;
            --bg-sidebar: #f1f5f9;
            --bg-element: #cbd5e1;
            --accent-blue: #0284c7;
            --accent-green: #16a34a;
            --accent-purple: #9333ea;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; transition: background-color 0.3s, color 0.3s; }

        #app-layout {
            display: flex;
            width: 100%;
            max-width: 1250px;
            height: 90vh;
            background: var(--bg-panel);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
        }

        #sidebar { width: 260px; background: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px; }
        .brand { font-size: 1.1rem; color: var(--text-main); font-weight: 700; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        
        .section-title { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); margin: 15px 0 8px 0; font-weight: 700; }
        
        .channel-list { list-style: none; margin-bottom: 20px; }
        .channel-btn { width: 100%; text-align: left; background: none; border: none; color: var(--text-muted); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
        .channel-btn:hover, .channel-btn.active { background: var(--bg-element); color: var(--accent-blue); }

        .theme-toggle { background: var(--bg-element); border: none; color: var(--text-main); padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }

        .search-box input { width: 100%; background: var(--bg-panel); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 8px; color: var(--text-main); font-size: 0.85rem; outline: none; }

        /* Área Principal */
        #chat-main { flex: 1; display: flex; flex-direction: column; position: relative; }
        #chat-header { padding: 16px 24px; background: var(--bg-panel); border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 6px; }
        
        #pinned-bar { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.2); padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; color: var(--accent-blue); display: none; justify-content: space-between; align-items: center; }

        #chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }

        .message-card { display: flex; gap: 12px; max-width: 80%; align-self: flex-start; }
        .message-card.mine { align-self: flex-end; flex-direction: row-reverse; }

        .msg-content { background: var(--bg-element); padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; position: relative; }
        .message-card.mine .msg-content { background: var(--accent-blue); color: #fff; }

        .msg-header { display: flex; justify-content: space-between; gap: 12px; font-size: 0.75rem; opacity: 0.85; margin-bottom: 4px; font-weight: 600; }
        .reply-preview { font-size: 0.75rem; background: rgba(0,0,0,0.15); padding: 4px 8px; border-radius: 6px; margin-bottom: 6px; border-left: 3px solid var(--accent-purple); }

        .avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.85rem; color: #fff; flex-shrink: 0; }

        /* Modales */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; }
        .modal-body { background: var(--bg-panel); border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; width: 350px; display: flex; flex-direction: column; gap: 12px; }
        .modal-body input { padding: 8px 12px; background: var(--bg-sidebar); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 6px; }

        #canvas-board { background: #fff; border-radius: 8px; cursor: crosshair; }

        .poll-card { background: var(--bg-sidebar); border: 1px solid var(--border-color); padding: 14px; border-radius: 12px; width: 280px; margin-top: 6px; }
        .poll-option { background: var(--bg-element); border: none; color: var(--text-main); width: 100%; padding: 8px; border-radius: 6px; margin-top: 6px; cursor: pointer; text-align: left; display: flex; justify-content: space-between; font-size: 0.85rem; }
        .poll-option:hover { background: var(--accent-blue); color: #fff; }

        /* Footer */
        #typing-indicator { font-size: 0.8rem; color: var(--text-muted); padding: 4px 24px; height: 20px; font-style: italic; }
        #chat-footer { padding: 16px 24px; background: var(--bg-sidebar); border-top: 1px solid var(--border-color); }
        #reply-bar { font-size: 0.8rem; color: var(--accent-blue); display: none; justify-content: space-between; margin-bottom: 8px; }

        #message-form { display: flex; gap: 8px; align-items: center; }
        #message-input { flex: 1; background: var(--bg-panel); border: 1px solid var(--border-color); padding: 12px 16px; border-radius: 10px; color: var(--text-main); outline: none; }

        .btn-action { background: var(--bg-element); border: none; color: var(--text-main); padding: 10px 14px; border-radius: 10px; cursor: pointer; font-size: 1rem; }
        .btn-action:hover { background: var(--accent-blue); color: #fff; }
        #send-btn { background: var(--accent-blue); color: #fff; font-weight: 700; padding: 10px 18px; }

        .picker-container { position: absolute; bottom: 80px; right: 24px; width: 320px; height: 320px; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 12px; display: none; flex-direction: column; z-index: 100; }
        .picker-tabs { display: flex; background: var(--bg-sidebar); border-bottom: 1px solid var(--border-color); }
        .picker-tab { flex: 1; padding: 10px; background: none; border: none; color: var(--text-muted); cursor: pointer; font-weight: 600; font-size: 0.85rem; }
        .picker-tab.active { color: var(--accent-blue); border-bottom: 2px solid var(--accent-blue); }
        .picker-content { flex: 1; padding: 12px; overflow-y: auto; display: grid; gap: 8px; }
        .emoji-grid { grid-template-columns: repeat(5, 1fr); font-size: 1.5rem; text-align: center; cursor: pointer; }
        .gif-grid { grid-template-columns: repeat(2, 1fr); }
        .gif-grid img { width: 100%; height: 80px; object-fit: cover; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="app-layout">
        <aside id="sidebar">
            <div class="brand">
                <span>🏫 Classroom LAN</span>
                <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">🌙</button>
            </div>

            <div class="section-title">Canales</div>
            <ul class="channel-list">
                <li><button class="channel-btn active" onclick="switchChannel('general')"># general</button></li>
                <li><button class="channel-btn" onclick="switchChannel('dudas')"># dudas</button></li>
                <li><button class="channel-btn" onclick="switchChannel('anuncios')"># anuncios</button></li>
                <li><button class="channel-btn" onclick="switchChannel('historial')">🔒 # historial</button></li>
            </ul>

            <div class="section-title">Herramientas</div>
            <button class="btn-action" style="width:100%; margin-bottom:8px; font-size:0.85rem;" onclick="openModal('poll-modal')">📊 Crear Encuesta</button>
            <button class="btn-action" style="width:100%; margin-bottom:15px; font-size:0.85rem;" onclick="openModal('whiteboard-modal')">🎨 Pizarra / Dibujo</button>

            <div class="search-box">
                <input type="text" id="search-input" placeholder="🔍 Buscar mensaje...">
            </div>
        </aside>

        <main id="chat-main">
            <header id="chat-header">
                <h3 id="current-channel-title"># general</h3>
                <div id="pinned-bar">
                    <span>📌 <strong id="pinned-text">Aviso fijado</strong></span>
                </div>
            </header>

            <section id="chat-messages"></section>

            <div id="typing-indicator"></div>

            <div id="media-picker" class="picker-container">
                <div class="picker-tabs">
                    <button class="picker-tab active" onclick="switchTab('emojis')">Emojis</button>
                    <button class="picker-tab" onclick="switchTab('gifs')">GIFs</button>
                </div>
                <div id="picker-body" class="picker-content emoji-grid"></div>
            </div>

            <footer id="chat-footer">
                <div id="reply-bar">
                    <span id="reply-target-text">Respondiendo a...</span>
                    <button onclick="cancelReply()" style="background:none; border:none; color:#ef4444; cursor:pointer;">✕</button>
                </div>
                <form id="message-form">
                    <input type="text" id="message-input" placeholder="Escribe un mensaje..." autocomplete="off" required>
                    <input type="file" id="file-input" style="display: none;">
                    <button type="button" class="btn-action" id="picker-btn">😀</button>
                    <button type="button" class="btn-action" id="attach-btn">📎</button>
                    <button type="submit" class="btn-action" id="send-btn">Enviar</button>
                </form>
            </footer>
        </main>
    </div>

    <!-- Modal Contraseña Historial -->
    <div id="password-modal" class="modal">
        <div class="modal-body">
            <h3>🔒 Canal Historial Protegido</h3>
            <p style="font-size:0.85rem; color:var(--text-muted);">Ingresa la contraseña para acceder al registro global:</p>
            <input type="password" id="history-pass-input" placeholder="Contraseña...">
            <button class="btn-action" style="background:var(--accent-blue); color:#fff;" onclick="submitHistoryPassword()">Acceder</button>
            <button class="btn-action" onclick="closeModal('password-modal')">Cancelar</button>
        </div>
    </div>

    <!-- Modal Encuesta -->
    <div id="poll-modal" class="modal">
        <div class="modal-body">
            <h3>📊 Crear Encuesta</h3>
            <input type="text" id="poll-q" placeholder="Pregunta...">
            <input type="text" id="poll-opt1" placeholder="Opción 1">
            <input type="text" id="poll-opt2" placeholder="Opción 2">
            <button class="btn-action" style="background:var(--accent-blue); color:#fff;" onclick="submitPoll()">Lanzar Encuesta</button>
            <button class="btn-action" onclick="closeModal('poll-modal')">Cancelar</button>
        </div>
    </div>

    <!-- Modal Pizarra -->
    <div id="whiteboard-modal" class="modal">
        <div class="modal-body" style="width: auto;">
            <h3>🎨 Pizarra de Dibujo</h3>
            <canvas id="canvas-board" width="400" height="300"></canvas>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button class="btn-action" style="background:var(--accent-green); color:#fff;" onclick="sendDrawing()">Compartir al Chat</button>
                <button class="btn-action" onclick="clearCanvas()">Limpiar</button>
                <button class="btn-action" onclick="closeModal('whiteboard-modal')">Cerrar</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        let username = sessionStorage.getItem('chat_username');
        if (!username) {
            username = prompt('Ingresa tu nombre:') || 'Estudiante';
            sessionStorage.setItem('chat_username', username);
        }

        socket.emit('user-join', username);

        const messagesContainer = document.getElementById('chat-messages');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const attachBtn = document.getElementById('attach-btn');
        const fileInput = document.getElementById('file-input');
        const pickerBtn = document.getElementById('picker-btn');
        const mediaPicker = document.getElementById('media-picker');
        const pickerBody = document.getElementById('picker-body');
        const typingIndicator = document.getElementById('typing-indicator');
        const searchInput = document.getElementById('search-input');
        
        let currentReply = null;
        let selectedChannel = 'general';

        // Alternar Tema Claro / Oscuro
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            const btn = document.getElementById('theme-btn');
            btn.innerText = document.body.classList.contains('light-theme') ? '☀️' : '🌙';
        }

        function getAvatarColor(name) {
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            return `hsl(${Math.abs(hash) % 360}, 65%, 45%)`;
        }

        function playSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.12);
            } catch (e) {}
        }

        // Gestión de Canales
        function switchChannel(channelName) {
            if (channelName === 'historial') {
                selectedChannel = 'historial';
                openModal('password-modal');
                return;
            }
            changeChannelDirect(channelName);
        }

        function submitHistoryPassword() {
            const pass = document.getElementById('history-pass-input').value;
            socket.emit('switch-channel', { channel: 'historial', password: pass });
            document.getElementById('history-pass-input').value = '';
            closeModal('password-modal');
        }

        function changeChannelDirect(channelName) {
            document.querySelectorAll('.channel-btn').forEach(btn => btn.classList.remove('active'));
            if (event && event.target) event.target.classList.add('active');
            document.getElementById('current-channel-title').innerText = `# ${channelName}`;
            messagesContainer.innerHTML = '';
            socket.emit('switch-channel', { channel: channelName });
        }

        socket.on('access-denied', (msg) => alert(msg));

        socket.on('channel-switched', (data) => {
            document.getElementById('current-channel-title').innerText = `# ${data.channel}`;
            messagesContainer.innerHTML = ''; // Limpiamos la vista actual

            // Renderizamos el historial guardado de ese canal específico
            if (data.history && data.history.length > 0) {
                data.history.forEach(msg => {
                    const isMine = msg.user === username;
                    
                    if (msg.type === 'text' || msg.text) {
                        let replyHtml = '';
                        if (msg.replyTo) {
                            replyHtml = `<div class="reply-preview">↳ ${escapeHtml(msg.replyTo.user)}: ${escapeHtml(msg.replyTo.text)}</div>`;
                        }
                        appendMessage(msg.user, msg.timestamp, replyHtml + escapeHtml(msg.text), isMine, msg.text);
                    } else if (msg.type === 'media' || msg.url) {
                        appendMessage(msg.user, msg.timestamp, `<img src="${msg.url}" style="max-width:200px; border-radius:8px;">`, isMine, 'Medio interactivo');
                    } else if (msg.type === 'file' || msg.fileUrl) {
                        appendMessage(msg.user, msg.timestamp, `📎 <a href="${msg.fileUrl}" target="_blank" download style="color:inherit;">${escapeHtml(msg.fileName)}</a>`, isMine, 'Archivo compartido');
                    }
                });
            }
        });

        // Fijar Mensaje
        function pinMessage(text) { socket.emit('pin-message', text); }
        socket.on('update-pinned', (data) => {
            const bar = document.getElementById('pinned-bar');
            document.getElementById('pinned-text').innerText = `${data.user}: ${data.text}`;
            bar.style.display = 'flex';
        });

        // Respuestas
        function setReply(user, text) {
            currentReply = { user, text };
            document.getElementById('reply-target-text').innerText = `Respondiendo a ${user}: "${text.substring(0, 20)}..."`;
            document.getElementById('reply-bar').style.display = 'flex';
        }

        function cancelReply() {
            currentReply = null;
            document.getElementById('reply-bar').style.display = 'none';
        }

        // Modales
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // Encuestas
        function submitPoll() {
            const q = document.getElementById('poll-q').value.trim();
            const opt1 = document.getElementById('poll-opt1').value.trim();
            const opt2 = document.getElementById('poll-opt2').value.trim();
            if (q && opt1 && opt2) {
                socket.emit('create-poll', { question: q, options: [opt1, opt2] });
                closeModal('poll-modal');
            }
        }

        socket.on('receive-poll', (poll) => renderPoll(poll));
        socket.on('update-poll', ({ id, poll }) => {
            const existing = document.getElementById(id);
            if (existing) existing.replaceWith(createPollElement(id, poll));
        });

        function renderPoll(poll) {
            const el = createPollElement(poll.id, poll);
            messagesContainer.appendChild(el);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function createPollElement(id, poll) {
            const div = document.createElement('div');
            div.id = id;
            div.className = 'poll-card';
            div.innerHTML = `<strong>📊 ${escapeHtml(poll.question)}</strong>`;
            poll.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'poll-option';
                btn.innerHTML = `<span>${escapeHtml(opt.text)}</span> <strong>${opt.votes} votos</strong>`;
                btn.onclick = () => socket.emit('vote-poll', { pollId: id, optionIndex: idx });
                div.appendChild(btn);
            });
            return div;
        }

        // Pizarra
        const canvas = document.getElementById('canvas-board');
        const ctx = canvas.getContext('2d');
        let drawing = false;

        canvas.addEventListener('mousedown', () => drawing = true);
        canvas.addEventListener('mouseup', () => { drawing = false; ctx.beginPath(); });
        canvas.addEventListener('mousemove', draw);

        function draw(e) {
            if (!drawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#000';
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
        function sendDrawing() {
            const dataUrl = canvas.toDataURL();
            socket.emit('share-drawing', dataUrl);
            clearCanvas();
            closeModal('whiteboard-modal');
        }

        // Buscador
        searchInput.addEventListener('input', (e) => {
            const filter = e.target.value.toLowerCase();
            document.querySelectorAll('.message-card').forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(filter) ? 'flex' : 'none';
            });
        });

        // Typing
        let typingTimeout;
        messageInput.addEventListener('input', () => {
            socket.emit('typing', true);
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => socket.emit('typing', false), 2000);
        });

        socket.on('user-typing', (data) => {
            typingIndicator.innerText = data.isTyping ? `${data.user} está escribiendo...` : '';
        });

        // Emojis y GIFs
        const emojis = ['😀', '😂', '😍', '😎', '👍', '🔥', '🎉', '🚀', '💯', '❤️', '🙌', '💩', '🤝', '⚡'];
        const gifs = ['https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHIxZ2s5ZzN0czJ3aWZocmdyZ3V4Nm9icXpzaTRscW16eWtlcnd4dyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/lhLIQcznZP77ZTLJnP/giphy.gif'];

        pickerBtn.addEventListener('click', () => {
            mediaPicker.style.display = mediaPicker.style.display === 'flex' ? 'none' : 'flex';
            switchTab('emojis');
        });

        function switchTab(tab) {
            document.querySelectorAll('.picker-tab').forEach(t => t.classList.remove('active'));
            if (event) event.target.classList.add('active');
            pickerBody.className = 'picker-content ' + (tab === 'emojis' ? 'emoji-grid' : 'gif-grid');
            pickerBody.innerHTML = '';

            if (tab === 'emojis') {
                emojis.forEach(e => {
                    const span = document.createElement('span');
                    span.innerText = e;
                    span.onclick = () => { messageInput.value += e; mediaPicker.style.display = 'none'; };
                    pickerBody.appendChild(span);
                });
            } else {
                gifs.forEach(url => {
                    const img = document.createElement('img');
                    img.src = url;
                    img.onclick = () => {
                        socket.emit('send-media', { type: 'gif', url });
                        mediaPicker.style.display = 'none';
                    };
                    pickerBody.appendChild(img);
                });
            }
        }

        // Form Submit
        messageForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (text) {
                socket.emit('send-message', { text, replyTo: currentReply });
                socket.emit('typing', false);
                messageInput.value = '';
                cancelReply();
            }
        });

        attachBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', async () => {
            const file = fileInput.files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append('file', file);
            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await res.json();
                socket.emit('share-file', data);
            } catch (err) { alert('Error al subir archivo'); }
            finally { fileInput.value = ''; }
        });

        // Eventos Socket
        socket.on('receive-message', (data) => {
            const isMine = data.user === username;
            if (!isMine) playSound();

            let replyHtml = '';
            if (data.replyTo) {
                replyHtml = `<div class="reply-preview">↳ ${escapeHtml(data.replyTo.user)}: ${escapeHtml(data.replyTo.text)}</div>`;
            }

            appendMessage(data.user, data.timestamp, replyHtml + escapeHtml(data.text), isMine, data.text);
        });

        socket.on('receive-media', (data) => {
            const isMine = data.user === username;
            if (!isMine) playSound();
            appendMessage(data.user, data.timestamp, `<img src="${data.url}" style="max-width:200px; border-radius:8px;">`, isMine, 'Medio interactivo');
        });

        socket.on('receive-file', (data) => {
            const isMine = data.user === username;
            if (!isMine) playSound();
            appendMessage(data.user, data.timestamp, `📎 <a href="${data.fileUrl}" target="_blank" download style="color:inherit;">${escapeHtml(data.fileName)}</a>`, isMine, 'Archivo compartido');
        });

        function appendMessage(user, time, body, isMine, rawText) {
            const avatarColor = getAvatarColor(user);
            const card = document.createElement('div');
            card.className = `message-card ${isMine ? 'mine' : ''}`;
            card.innerHTML = `
                <div class="avatar" style="background:${avatarColor}">${user.charAt(0).toUpperCase()}</div>
                <div class="msg-content">
                    <div class="msg-header">
                        <span>${escapeHtml(user)}</span>
                        <span>
                            <button onclick="setReply('${escapeHtml(user)}', '${escapeHtml(rawText || '')}')" style="background:none; border:none; color:inherit; cursor:pointer; font-size:0.7rem;">↩ Responder</button>
                            <button onclick="pinMessage('${escapeHtml(rawText || '')}')" style="background:none; border:none; color:inherit; cursor:pointer; font-size:0.7rem;">📌 Fijar</button>
                            ${time}
                        </span>
                    </div>
                    <div>${body}</div>
                </div>
            `;
            messagesContainer.appendChild(card);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
