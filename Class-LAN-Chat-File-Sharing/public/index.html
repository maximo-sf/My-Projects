<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2º ASIR Chat</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div id="toast-container"></div>

    <div id="app-layout">
        <nav id="floating-dock">
            <button class="dock-btn active" title="Canal General" onclick="switchChannel('general')">💬</button>
            <button class="dock-btn" title="Historial Protegido" onclick="switchChannel('historial')">🔒</button>
            <div class="dock-separator"></div>
            <button class="dock-btn" title="Pizarra Interactiva" onclick="openModal('whiteboard-modal')">🎨</button>
            <button class="dock-btn" title="Crear Encuesta" onclick="openModal('poll-modal')">📊</button>
        </nav>

        <main id="chat-canvas">
            <header id="chat-header">
                <div class="channel-tag">
                    <span class="pulse-badge"></span>
                    <span id="current-channel-title"># general</span>
                </div>
                
                <div style="display:flex; align-items:center; gap:16px;">
                    <div class="search-box">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="search-input" class="search-input" placeholder="Buscar..." oninput="filterMessages()">
                    </div>
                    <div style="font-size:0.85rem; color:var(--text-sub)">Online: <b id="user-count" style="color:var(--neon-green)">0</b></div>
                </div>
            </header>

            <section id="chat-messages"></section>

            <!-- PIE DE CHAT CON BOTONES INTEGRADOS -->
            <footer id="chat-footer">
                <form id="message-form">
                    <div id="input-bar">
                        <!-- Botón personalizado para adjuntar archivo -->
                        <label class="file-btn-wrapper dock-btn" style="width:38px; height:38px; border-radius:10px; cursor:pointer;" title="Adjuntar archivo">
                            📎
                            <input type="file" id="file-input" style="display:none;">
                        </label>

                        <!-- Campo de texto -->
                        <input type="text" id="message-input" placeholder="Escribe un mensaje..." autocomplete="off">

                        <!-- Botón de enviar integrado -->
                        <button type="submit" id="send-btn" class="btn-primary" style="padding: 8px 16px; border-radius:10px;">
                            Enviar ⚡
                        </button>
                    </div>
                </form>
            </footer>
        </main>

<aside id="right-panel">
    <!-- 1. MI ESTADO -->
    <div class="glass-card">
        <h4 style="font-size:0.85rem; color:var(--text-sub); margin-bottom:8px">MI ESTADO</h4>
        <div class="status-selector">
            <button class="status-opt active" onclick="setStatus('🟢')">🟢</button>
            <button class="status-opt" onclick="setStatus('🔴')">🔴</button>
            <button class="status-opt" onclick="setStatus('🌙')">🌙</button>
        </div>
    </div>

    <!-- 2. SALA DE VOZ P2P -->
    <div class="glass-card">
        <h4 style="margin-bottom:12px; font-size:0.85rem; color:var(--text-sub)">SALA DE VOZ P2P</h4>
        <button id="voice-toggle-btn" class="dock-btn" style="width:100%; height:44px; font-size:0.85rem; font-weight:700" onclick="toggleVoice()">🎙️ Unirme a Audio</button>
        <ul id="voice-users-list" style="margin-top:10px; font-size:0.8rem; list-style:none; color:var(--text-sub)"></ul>
    </div>

    <!-- 3. USUARIOS EN RED -->
    <div class="glass-card" style="flex:1; display:flex; flex-direction:column">
        <h4 style="margin-bottom:12px; font-size:0.85rem; color:var(--text-sub)">USUARIOS EN RED</h4>
        <ul id="user-list" style="list-style:none; display:flex; flex-direction:column; gap:8px; font-size:0.85rem"></ul>
    </div>
</aside>
    </div>

<!-- Ejemplo para Modal Clave de Historial -->
    <div id="password-modal" class="modal">
        <div class="modal-body">
            <h3 style="font-size:1.1rem; color:var(--text-primary)">🔒 Clave de Historial</h3>
            <input type="password" id="history-pass-input" placeholder="Ingresa contraseña...">
            <div style="display:flex; gap:10px; justify-content:flex-end;">
                <button type="button" class="btn-secondary" onclick="closeModal('password-modal')">Cancelar</button>
                <button type="button" class="btn-primary" onclick="submitHistoryPassword()">Acceder</button>
            </div>
        </div>
    </div>

    <div id="poll-modal" class="modal">
        <div class="modal-body">
            <h3>📊 Encuesta Flash</h3>
            <input type="text" id="poll-q" placeholder="Pregunta...">
            <input type="text" id="poll-opt1" placeholder="Opción A">
            <input type="text" id="poll-opt2" placeholder="Opción B">
            <button id="send-btn" onclick="submitPoll()">Lanzar Encuesta</button>
            <button class="icon-btn" onclick="closeModal('poll-modal')">Cerrar</button>
        </div>
    </div>

<!-- MODAL PIZARRA CON PALETA DE COLORES -->
<div id="whiteboard-modal" class="modal">
    <div class="modal-body" style="width: auto; max-width: 90vw;">
        <h3 style="margin-bottom: 8px;">🎨 Pizarra Digital</h3>
        
        <!-- Paleta de Colores -->
        <div style="display: flex; gap: 8px; margin-bottom: 12px; align-items: center;">
            <span style="font-size: 0.85rem; color: var(--text-sub);">Color:</span>
            <button type="button" class="color-btn active" onclick="setCanvasColor('#0f172a', this)" style="background:#0f172a;"></button>
            <button type="button" class="color-btn" onclick="setCanvasColor('#ef4444', this)" style="background:#ef4444;"></button>
            <button type="button" class="color-btn" onclick="setCanvasColor('#10b981', this)" style="background:#10b981;"></button>
            <button type="button" class="color-btn" onclick="setCanvasColor('#0284c7', this)" style="background:#0284c7;"></button>
            <button type="button" class="color-btn" onclick="setCanvasColor('#8b5cf6', this)" style="background:#8b5cf6;"></button>
            <button type="button" class="btn-secondary" style="margin-left: auto; padding: 4px 8px; font-size: 0.75rem;" onclick="clearCanvas()">🗑️ Limpiar</button>
        </div>

        <canvas id="canvas-board" width="500" height="300" style="background:#ffffff; border: 1px solid var(--glass-border-subtle); border-radius: 12px; cursor: crosshair;"></canvas>
        
        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 12px;">
            <button type="button" class="btn-secondary" onclick="closeModal('whiteboard-modal')">Cancelar</button>
            <button type="button" class="btn-primary" onclick="sendDrawing()">Compartir Dibujo</button>
        </div>
    </div>
</div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
